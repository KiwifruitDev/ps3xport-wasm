name: Build WASM

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-wasm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile and commit WASM
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build WebAssembly
        run: npm run build

      - name: Verify generated files
        shell: bash
        run: |
          test -s web/ps3xport.mjs
          test -s web/ps3xport.wasm
          echo "Both WebAssembly artifacts were generated successfully."

      - name: Commit generated files
        shell: bash
        run: |
          git add -f web/ps3xport.mjs web/ps3xport.wasm

          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Build WebAssembly artifacts"
          git push
